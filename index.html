<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Tehnic Softprim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .out-of-stock { opacity: 0.5; filter: grayscale(1); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Catalog Produse</h1>

            <!-- 5.2 Filtrare -->
            <div class="mt-6 flex flex-col md:flex-row md:items-center gap-4">
                <label for="categoryFilter" class="font-medium">Filtrează după categorie:</label>
                <select id="categoryFilter" class="p-2 border rounded-md bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none md:w-64">
                    <option value="">Toate categoriile</option>
                </select>
            </div>
        </header>

        <!-- 5.3 Stări UI: Eroare -->
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6" role="alert">
            <span class="block sm:inline" id="errorText">A apărut o eroare.</span>
            <button onclick="init()" class="underline font-bold ml-2">Reîncearcă</button>
        </div>

        <!-- 5.3 Stări UI: Încărcare -->
        <div id="loader" class="flex justify-center items-center py-20 hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <span class="ml-3 text-gray-600">Se încarcă datele...</span>
        </div>

        <!-- 5.1 & 5.4 Listare Produse (Responsive Grid) -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Produsele vor fi injectate aici -->
        </div>

        <!-- 5.3 Stare: Listă goală -->
        <div id="emptyMessage" class="hidden text-center py-20 text-gray-500 text-lg">
            Nu sunt produse în această categorie.
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        const els = {
            grid: document.getElementById('productsGrid'),
            filter: document.getElementById('categoryFilter'),
            loader: document.getElementById('loader'),
            error: document.getElementById('errorMessage'),
            errorText: document.getElementById('errorText'),
            empty: document.getElementById('emptyMessage')
        };

        // Formatare preț: 2 zecimale + RON
        const formatPrice = (price) => new Intl.NumberFormat('ro-RO', { style: 'currency', currency: 'RON' }).format(price);

        async function fetchCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`);
                const data = await res.json();
                els.filter.innerHTML = '<option value="">Toate categoriile</option>' +
                    data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (err) {
                showError("Nu am putut încărca categoriile.");
            }
        }

        async function fetchProducts(catId = '') {
            toggleUI('loading');
            try {
                const url = catId ? `${API_BASE}/products?category_id=${catId}` : `${API_BASE}/products`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Eroare server");

                const products = await res.json();
                renderProducts(products);
            } catch (err) {
                showError("Eroare la preluarea produselor.");
            }
        }

        function renderProducts(products) {
            if (products.length === 0) {
                toggleUI('empty');
                return;
            }

            els.grid.innerHTML = products.map(p => {
                const isOutOfStock = p.stock === 0;
                return `
                    <div class="bg-white p-4 rounded-lg shadow hover:shadow-md transition-shadow flex flex-col ${isOutOfStock ? 'out-of-stock' : ''}">
                        <div class="flex-1">
                            <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">${p.category_name}</span>
                            <h3 class="text-lg font-bold text-gray-800 mt-1">${p.name}</h3>
                            <p class="text-2xl font-black text-gray-900 mt-4">${formatPrice(p.price)}</p>
                        </div>
                        <div class="mt-4 pt-4 border-t flex justify-between items-center">
                            <span class="text-sm ${isOutOfStock ? 'text-red-600 font-bold' : 'text-gray-500'}">
                                ${isOutOfStock ? 'STOC EPUIZAT' : `Stoc: ${p.stock} buc.`}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            toggleUI('success');
        }

        function toggleUI(state) {
            els.loader.classList.toggle('hidden', state !== 'loading');
            els.grid.classList.toggle('hidden', state !== 'success');
            els.empty.classList.toggle('hidden', state !== 'empty');
            els.error.classList.add('hidden');
        }

        function showError(msg) {
            els.loader.classList.add('hidden');
            els.grid.classList.add('hidden');
            els.error.classList.remove('hidden');
            els.errorText.textContent = msg;
        }

        els.filter.addEventListener('change', (e) => fetchProducts(e.target.value));

        function init() {
            fetchCategories();
            fetchProducts();
        }

        init();
    </script>
</body>
</html>
